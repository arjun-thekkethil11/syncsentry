# Postgres for local development. The orchestrator binary itself isn't
# containerized here -- for a personal project, `go run .` against this
# Postgres is simpler to iterate on than rebuilding an image per change;
# see README.md for the Dockerfile you'd add for an actual deployment.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: syncsentry
      POSTGRES_PASSWORD: syncsentry
      POSTGRES_DB: syncsentry
    ports:
      - "5432:5432"
    volumes:
      - syncsentry_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U syncsentry"]
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  syncsentry_pg_data:
