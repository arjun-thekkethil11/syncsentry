[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "syncsentry"
version = "0.1.0"
description = "Detects and fixes audio/video sync drift using lip motion and speech"
requires-python = ">=3.11"

[project.scripts]
syncsentry = "syncsentry.cli:main"

[tool.setuptools.packages.find]
include = ["syncsentry*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
