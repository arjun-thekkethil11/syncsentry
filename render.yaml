services:
  - type: web
    runtime: python
    name: syncsentry-api
    rootDir: analyzer
    buildCommand: pip install -r requirements-core.txt -r requirements-api.txt && pip install -e .
    startCommand: uvicorn syncsentry.api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

  - type: web
    runtime: static
    name: syncsentry-webapp
    rootDir: webapp
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
