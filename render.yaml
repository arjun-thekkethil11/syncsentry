services:
  # Full build: installs torch + fetches SyncNet so use_syncnet actually
  # runs the learned detector. On Render's free instance type (0.1 CPU /
  # 512MB, both hard allocations, not burstable), two separate limits
  # both matter here and were fixed separately:
  #
  # 1. CPU: 0.1 CPU is roughly one-tenth of a single shared core, so real
  #    inference time is dominated by that hardware allocation, not by
  #    how the software is tuned. `analyzer/syncsentry/lipsync/
  #    syncnet_offset.py`'s `FACEDET_SCALE` and the piecewise-detection
  #    fix in `piecewise_offset.MIN_SEGMENT_SUPPORT_CHUNKS` both cut real,
  #    measured wall time substantially (see their own comments), but
  #    neither changes the underlying hardware ceiling: a strict
  #    under-30-second budget for real face-detection + CNN inference is
  #    not realistically achievable on 0.1 CPU alone.
  #
  # 2. Memory, the more severe of the two: measured directly, one
  #    use_syncnet request's peak memory (parent process plus the S3FD
  #    face-tracking subprocess it launches) was over 2.6GB against this
  #    plan's 512MB *hard* cap, over 5x, before the fixes below. Unlike
  #    CPU, which just runs slower when scarce, exceeding a memory cap
  #    gets the whole process OOM-killed outright, mid-request, and the
  #    next request pays a full cold-start again (re-importing torch,
  #    reloading every model): this, not raw compute time, is the likely
  #    cause of requests that seem to hang far longer than the actual
  #    algorithm should take. Three fixes, all in `syncnet_offset.py`
  #    (BATCH_SIZE) and patched into the vendored SyncNet code by
  #    `fetch_syncnet.sh` (torch.no_grad() during inference, dropping a
  #    redundant float64 copy of the video tensor), cut that peak by
  #    roughly 3-4x with zero change to detected offsets, confidence
  #    scores, or wall time (if anything, slightly faster) on every clip
  #    tested. Even after these fixes, a single request's peak is still
  #    measured above 512MB, so OOM kills on this specific free plan are
  #    reduced, not eliminated, by software changes alone; the remaining
  #    headroom needs either a plan with more than 512MB, or a larger
  #    change (running S3FD in-process instead of as its own subprocess,
  #    to stop paying for a second torch import).
  #
  # To go back to the lightweight, coarse-detector-only build (faster to
  # deploy, no torch, always falls back safely, and has none of the
  # memory profile above since it never loads SyncNet or S3FD), drop
  # requirements-ml.txt and the fetch_syncnet.sh line from buildCommand,
  # and drop the SyncNet-specific envVars below.
  - type: web
    runtime: python
    name: syncsentry-api
    rootDir: analyzer
    buildCommand: >-
      pip install -r requirements-core.txt -r requirements-api.txt -r requirements-ml.txt &&
      pip install -e . &&
      bash scripts/fetch_syncnet.sh
    startCommand: uvicorn syncsentry.api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # Avoids thread oversubscription: torch/numpy default to spawning
      # threads based on the host machine's real core count, which on a
      # shared/throttled instance is unrelated to the 0.1 CPU actually
      # allocated. More threads than that just adds context-switch
      # overhead with nothing to run them on.
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      # Keeps peak memory to one resident SyncNet model rather than up to
      # MAX_REFINE_WORKERS (4) of them at once during piecewise
      # refinement; see piecewise_offset.py's module docstring.
      - key: SYNCSENTRY_MAX_REFINE_WORKERS
        value: "1"
      # Shrinks the representative window SyncNet analyzes per call.
      # Wall-clock cost scales close to linearly with this, so smaller
      # keeps a single request's worst case more predictable on a slow
      # host, at the cost of a smaller sample.
      #
      # Left at the code's own default (20s) rather than shrunk further:
      # measured directly against the real-content blind benchmark, 8s
      # is not just slower-vs-faster, it actively produces wrong answers
      # on longer/multi-scene dialogue content (S3FD finds no trackable
      # face in an 8s window centered on some of those clips, silently
      # falling back to the much less accurate coarse detector). 20s is
      # the shortest value confirmed to still find a real face track and
      # the correct offset on that same content; going shorter trades
      # away correctness for speed, not just speed for speed.
      - key: SYNCSENTRY_MAX_ANALYZE_DURATION_S
        value: "20"
      # Hard ceiling on the face-tracking subprocess so a single request
      # can never hang indefinitely: past this, it aborts and falls back
      # to the coarse detector instead of the caller waiting forever.
      #
      # Was 180s: on this plan's 0.1 CPU, that let one request wait up to
      # three minutes before giving up on a single SyncNet attempt, and
      # (before the abort-signal fix in `piecewise_offset.py`/
      # `pipeline.py`) a multi-region clip could pay that same 180s
      # again per region and again for verification, compounding into
      # requests that ran for many minutes. Both call sites now share one
      # abort signal per request, so on this host SyncNet fails fast
      # once and every later attempt in the same request skips straight
      # to the coarse detector instead of re-discovering the same
      # timeout. That makes a small single value here safe: it now
      # bounds one request's worst case (one timeout, not N of them), so
      # it's set tight enough to keep the whole request comfortably
      # under a 30s target on this hardware, at the cost of SyncNet
      # essentially never finishing in time on this specific free plan;
      # it still always tries first and only falls back after failing to
      # finish, so a stronger host (a paid plan, or SyncNet moved to a
      # separate service with real CPU) gets full SyncNet benefit from
      # the same code with no change other than this value.
      - key: SYNCSENTRY_SYNCNET_TIMEOUT_S
        value: "15"

  - type: web
    runtime: static
    name: syncsentry-webapp
    rootDir: webapp
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
