name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-analyzer:
    runs-on: macos-14
    defaults:
      run:
        working-directory: analyzer
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        run: brew install ffmpeg

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-core.txt
          pip install -r requirements-api.txt
          pip install -r requirements-ml.txt
          pip install -e .

      - name: Run tests
        run: pytest tests/ -v

      - name: Run benchmark (smoke check that CLI + report generation works)
        run: syncsentry benchmark --out-dir /tmp/benchmark-results

  test-orchestrator:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/orchestrator
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./... -v
